spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Donor-Service
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate   # use 'update' for dev, 'validate' for prod
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc.lob.non_contextual_creation: true

#  flyway:
#    enabled: true
#    baseline-on-migrate: true
#    locations: classpath:db/migration
  flyway:
    enabled: false


internal:service-token: my-shared-secret
